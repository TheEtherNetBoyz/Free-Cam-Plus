name: Build Freecam+

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64 package
    runs-on: macos-26

    steps:
      - name: Check out Freecam+
        uses: actions/checkout@v4

      - name: Check out Dusklight
        uses: actions/checkout@v4
        with:
          repository: TheEtherNetBoyz/EtherNet-MFB
          # Build against the current host. Newer WindowService fields are detected at runtime.
          ref: main
          path: dusklight
          fetch-depth: 1
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Configure Dusklight host
        working-directory: dusklight
        run: cmake --preset x-macos-ci-arm64

      - name: Build Dusklight host
        working-directory: dusklight
        run: cmake --build --preset x-macos-ci-arm64 --target dusklight --parallel 4

      - name: Locate Dusklight host executable
        shell: bash
        run: |
          dusk_game_exe="$(find "$GITHUB_WORKSPACE/dusklight/build/x-macos-ci-arm64" \
            -path '*/Dusklight.app/Contents/MacOS/Dusklight' -print -quit)"
          test -n "$dusk_game_exe"
          echo "DUSK_GAME_EXE=$dusk_game_exe" >> "$GITHUB_ENV"

      - name: Configure Freecam+
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DDUSK_DIR="$GITHUB_WORKSPACE/dusklight"
          -DDUSK_GAME_EXE="$DUSK_GAME_EXE"

      - name: Build Freecam+ package
        run: cmake --build build --target secondary_camera_package --parallel 4

      - name: Upload Freecam+ package
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-plus-macos-arm64
          path: build/mods/secondary_camera.dusk
          if-no-files-found: error
          retention-days: 14

  build-windows-x86_64:
    name: Build Windows x86-64 package
    runs-on: windows-2022

    steps:
      - name: Check out Freecam+
        uses: actions/checkout@v4

      - name: Check out Dusklight
        uses: actions/checkout@v4
        with:
          repository: TheEtherNetBoyz/EtherNet-MFB
          # Build against the current host. Newer WindowService fields are detected at runtime.
          ref: main
          path: dusklight
          fetch-depth: 1
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Override VCPKG_ROOT
        shell: pwsh
        run: '"VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Dusklight dependencies
        shell: pwsh
        run: vcpkg install freetype:x64-windows zstd:x64-windows

      - name: Configure Dusklight host
        working-directory: dusklight
        run: cmake --preset x-windows-ci-msvc

      - name: Build Dusklight host
        working-directory: dusklight
        run: cmake --build --preset x-windows-ci-msvc --target dusklight --parallel 4

      - name: Locate Dusklight import library
        shell: pwsh
        run: |
          $implib = Get-ChildItem "$env:GITHUB_WORKSPACE/dusklight/build/x-windows-ci-msvc" `
            -Recurse -Filter dusklight_imports.lib |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $implib) {
            throw "Dusklight import library was not generated"
          }
          "DUSK_GAME_IMPLIB=$implib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Freecam+
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DDUSK_DIR=$env:GITHUB_WORKSPACE/dusklight"
          "-DDUSK_GAME_EXE=$env:DUSK_GAME_IMPLIB"

      - name: Build Freecam+ package
        run: cmake --build build --target secondary_camera_package --parallel 4

      - name: Upload Freecam+ package
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-plus-windows-x86_64
          path: build/mods/secondary_camera.dusk
          if-no-files-found: error
          retention-days: 14
