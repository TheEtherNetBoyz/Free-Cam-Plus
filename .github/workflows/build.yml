name: Build Freecam+

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64 package
    runs-on: macos-14

    steps:
      - name: Check out Freecam+
        uses: actions/checkout@v4

      - name: Check out Dusklight
        uses: actions/checkout@v4
        with:
          repository: TheEtherNetBoyz/EtherNet-MFB
          ref: main
          path: dusklight
          fetch-depth: 1
          submodules: recursive

      - name: Install build tools
        run: brew install cmake ninja

      - name: Configure Dusklight host
        working-directory: dusklight
        run: cmake --preset x-macos-ci-arm64

      - name: Build Dusklight host
        working-directory: dusklight
        run: cmake --build --preset x-macos-ci-arm64 --target dusklight --parallel 4

      - name: Locate Dusklight host executable
        shell: bash
        run: |
          dusk_game_exe="$(find "$GITHUB_WORKSPACE/dusklight/build/x-macos-ci-arm64" \
            -path '*/Dusklight.app/Contents/MacOS/Dusklight' -print -quit)"
          test -n "$dusk_game_exe"
          echo "DUSK_GAME_EXE=$dusk_game_exe" >> "$GITHUB_ENV"

      - name: Configure Freecam+
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DDUSK_DIR="$GITHUB_WORKSPACE/dusklight"
          -DDUSK_GAME_EXE="$DUSK_GAME_EXE"

      - name: Build Freecam+ package
        run: cmake --build build --target secondary_camera_package --parallel 4

      - name: Upload Freecam+ package
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-plus-macos-arm64
          path: build/mods/secondary_camera.dusk
          if-no-files-found: error
          retention-days: 14

  build-windows-x86_64:
    name: Build Windows x86-64 package
    runs-on: windows-2022

    steps:
      - name: Check out Freecam+
        uses: actions/checkout@v4

      - name: Check out Dusklight
        uses: actions/checkout@v4
        with:
          repository: TheEtherNetBoyz/EtherNet-MFB
          ref: main
          path: dusklight
          fetch-depth: 1
          submodules: recursive

      - name: Enable Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress --yes

      - name: Configure Freecam+
        shell: pwsh
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          "-DDUSK_DIR=$env:GITHUB_WORKSPACE/dusklight"

      - name: Build Freecam+ package
        run: cmake --build build --target secondary_camera_package --parallel 4

      - name: Upload Freecam+ package
        uses: actions/upload-artifact@v4
        with:
          name: Freecam-plus-windows-x86_64
          path: build/mods/secondary_camera.dusk
          if-no-files-found: error
          retention-days: 14
